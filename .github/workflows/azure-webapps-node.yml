# This workflow will build and test the Node.js CLI application

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  NODE_VERSION: 20.x

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run build (if present)
      run: npm run build --if-present

    - name: Run tests
      run: npm test

    - name: Verify CLI runs
      run: |
        node bin/copilot-cli.js
        node bin/copilot-cli.js help
        node bin/copilot-cli.js info
